services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: karon
      POSTGRES_PASSWORD: karon
      POSTGRES_DB: karon
    volumes:
      - karon_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karon"]
      interval: 10s
      timeout: 3s
      retries: 10

  karon:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DATABASE_URL=postgres://karon:karon@postgres:5432/karon?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  karon_pgdata:
