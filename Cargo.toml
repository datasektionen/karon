[package]
name = "karon"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.13.0"
actix-web-httpauth = "0.8.2"
askama = "0.16.0"
bitflags = "2.11.1"
chrono = "0.4.44"
openidconnect = "4.0.1"
reqwest = { version = "0.13.3", features = ["json"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
]}
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.21"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter"
]}
